name: Intel Linux Build
on: [push, pull_request]

# Use custom shell with -l so .bash_profile is sourced which loads intel/oneapi/setvars.sh
# without having to do it in manually every step
defaults:
  run:
    shell: bash -leo pipefail {0}

# Set I_MPI_CC/F90 so Intel MPI wrapper uses icc/ifort instead of gcc/gfortran
env:
  cache_key: intel
  CC: icc
  FC: ifort
  CXX: icpc
  I_MPI_CC: icc
  I_MPI_F90: ifort
  # Spack must come from upstream at a fixed release, not JCSDA/spack
  # JCSDA/spack's default branch is now spack-stack-only and refers to ${SPACK_STACK_DIR}
  # v0.23 is the last release supporting classic intel (icc/ifort) compiler
  SPACK_REPO: https://github.com/spack/spack.git
  SPACK_REF: releases/v0.23
  SPACK_ENV_FILE: ci/spack_intel.yaml

# A note on flushing Action cache and relevance to "cache_key" above.
# There is no way to flush the Action cache, and hence a number (#) is appended
# to the "cache_key" (intel).
# If the dependencies change, increment this number and a new cache will be
# generated by the dependency build step "setup"
# There is a Github issue to force clear the cache.
# See discussion on:
# https://stackoverflow.com/questions/63521430/clear-cache-in-github-actions

# The jobs are split into:
# 1. a dependency build step (setup), and
# 2. a GSI-utils build step (gsi-utils)
# The setup is run once and the environment is cached,
# so each subsequent build of gsi-utils can reuse the cached dependencies to save time (and compute).

jobs:
  setup:
    # Pinned: icc/ifort 2023.2 are not tested against glibc/GCC of ubuntu 24.04
    runs-on: ubuntu-22.04

    steps:
      # Free up disk space
      - name: free-disk-spack
        run: |
          df -h
          sudo swapoff -a
          sudo rm -rf /swapfile
          sudo rm -rf /usr_local_mv
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo apt clean
          DOCKER_IMGS=$(docker image ls -aq)
          if [[ ! -z "${DOCKER_IMGS}" ]]; then docker rmi ${DOCKER_IMGS}; fi
          df -h

      # Checkout to get spack environment file
      # Must always run: hashFiles() in cache key below needs it
      - name: checkout
        uses: actions/checkout@v4
        with:
          path: gsi-utils

      # Cache spack, compiler and dependencies
      - name: cache-env
        id: cache-env
        uses: actions/cache@v4
        with:
          path: |
            spack
            ~/.spack
            /opt/intel
          key: spack-${{ runner.os }}-${{ env.cache_key }}-${{ hashFiles(format('gsi-utils/{0}', env.SPACK_ENV_FILE)) }}-8

      # Compilers and MPI are pinned to matching oneAPI release
      # so icc/ifort and Intel MPI wrappers (mpiicc/mpiifort) match
      - name: install-intel-compilers
        if: steps.cache-env.outputs.cache-hit != 'true'
        run: |
          wget -qO- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
            | gpg --dearmor | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update
          sudo apt-get install -y \
            intel-oneapi-dev-utilities-2021.10.0 \
            intel-oneapi-mpi-devel-2021.10.0 \
            intel-oneapi-openmp-2023.2.1 \
            intel-oneapi-compiler-fortran-2023.2.1 \
            intel-oneapi-compiler-dpcpp-cpp-and-cpp-classic-2023.2.1
          sudo apt-get clean
          echo "source /opt/intel/oneapi/setvars.sh" >> ~/.bash_profile

      # Install dependencies using Spack
      - name: install-dependencies-with-spack
        if: steps.cache-env.outputs.cache-hit != 'true'
        run: |
          sudo mv /usr/local/ /usr_local_mv
          sudo apt-get install -y cmake
          rm -rf spack
          git clone -c feature.manyFiles=true --depth 1 --branch "${SPACK_REF}" "${SPACK_REPO}" spack
          source spack/share/spack/setup-env.sh
          spack env create gsiutils-env gsi-utils/${SPACK_ENV_FILE}
          spack env activate gsiutils-env
          spack compiler find
          spack compilers
          spack external find
          # Register apt-installed intel-oneapi-mpi as external so Spack uses it
          # instead of building its own, ensuring MPI matches what GSI-utils build uses.
          # +classic-names is essential: without it Spack uses mpiicx/mpiicpx (icx/icpx)
          # which don't match the classic icc/ifort compiler. With +classic-names Spack
          # uses mpiicc/mpiicpc/mpiifort.
          cat > intel-mpi-external.yaml <<'EOF'
          packages:
            intel-oneapi-mpi:
              externals:
              - spec: intel-oneapi-mpi@2021.10.0+classic-names
                prefix: /opt/intel/oneapi
              buildable: false
          EOF
          spack config add -f intel-mpi-external.yaml
          spack concretize
          export SPACK_NO_PARALLEL_MAKE=1
          spack install --fail-fast --dirty -j1
          spack clean -a

  gsi-utils:
    needs: setup
    runs-on: ubuntu-22.04

    steps:
      - name: install-intel
        run: |
          echo "source /opt/intel/oneapi/setvars.sh" >> ~/.bash_profile

      - name: checkout-gsiutils
        uses: actions/checkout@v4
        with:
          path: gsi-utils

      # Restore cache from setup job (key must match exactly)
      - name: cache-env
        id: cache-env
        uses: actions/cache/restore@v4
        with:
          path: |
            spack
            ~/.spack
            /opt/intel
          key: spack-${{ runner.os }}-${{ env.cache_key }}-${{ hashFiles(format('gsi-utils/{0}', env.SPACK_ENV_FILE)) }}-8
          fail-on-cache-miss: true

      - name: build
        run: |
          sudo mv /usr/local/ /usr_local_mv
          sudo apt-get install -y cmake libblas-dev liblapack-dev
          source spack/share/spack/setup-env.sh
          # Activate WITHOUT the view to avoid Fortran module conflicts
          # (e.g., sp/ip with different precisions having conflicting .mod files)
          spack env activate --without-view gsiutils-env
          # Build CMAKE_PREFIX_PATH from individual package install prefixes
          PREFIXES=$(spack find --format '{prefix}' | grep '/spack/opt/spack/' | sort -u | paste -sd';' -)
          echo "CMAKE_PREFIX_PATH entries:"; echo "${PREFIXES}" | tr ';' '\n'
          cd gsi-utils
          mkdir -p build && cd build
          cmake -DCMAKE_INSTALL_PREFIX=../install -DBUILD_UTIL_ALL=ON \
                -DCMAKE_PREFIX_PATH="${PREFIXES}" ..
          make -j2 VERBOSE=1
          make install
        env:
          CC: mpiicc
          FC: mpiifort
